[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kimi-lastcall"
version = "0.2.0"
description = "A local handoff gate and human-confirmed, verified /new controller for managed Kimi Code sessions."
readme = "README.md"
requires-python = ">=3.8"
dependencies = []
license = {file = "LICENSE"}
authors = [{name = "kagamiurayama"}]

[project.scripts]
kimi-lastcall = "kimi_lastcall.cli:entry"
kimi-lastcall-hook = "kimi_lastcall.gate:entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "AUTHORS.md", "ACKNOWLEDGEMENTS.md"]

[tool.setuptools.data-files]
"share/doc/kimi-lastcall" = ["README.md", "README.zh-CN.md", "AUTHORS.md", "ACKNOWLEDGEMENTS.md"]

[tool.setuptools.package-data]
kimi_lastcall = ["templates/*.md", "web/*.html", "web/*.css", "web/*.js"]
